
name: Build PalletFinder APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PalletFinderAndroid_Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -o PalletFinderAndroid_Source.zip -d project

      - name: Fix Android and Java compatibility
        run: |
          sed -i 's/minSdk = 23/minSdk = 26/' project/app/build.gradle.kts
          sed -i 's/minSdkVersion(23)/minSdkVersion(26)/' project/app/build.gradle.kts
          sed -i '/android {/a\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }' project/app/build.gradle.kts

      - name: Build APK
        run: |
          cd project
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PalletFinder-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
