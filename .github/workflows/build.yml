
name: Build PalletFinder APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PalletFinderAndroid_Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          unzip -o PalletFinderAndroid_Source.zip -d project
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

