
name: Build PalletFinder APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PalletFinderAndroid_Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q PalletFinderAndroid_Source.zip -d project

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PalletFinder-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
