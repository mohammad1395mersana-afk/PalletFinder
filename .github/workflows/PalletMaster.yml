
name: Build PalletMaster APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PalletMaster_Source.zip'
      - '.github/workflows/PalletMaster.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract PalletMaster source
        run: unzip -o PalletMaster_Source.zip -d .

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p palletmaster assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PalletMaster-APK
          path: palletmaster/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
