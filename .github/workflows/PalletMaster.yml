
name: Build PalletMaster APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PalletMaster_Source.zip'
      - '.github/workflows/PalletMaster.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract PalletMaster source
        run: unzip -o PalletMaster_Source.zip -d .

      - name: Fix Android and JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("palletmaster/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("minSdk = 23", "minSdk = 26")
          s = s.replace(
              "    }\n}",
              """    }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }""",
              1
          )
          s += """
          
          kotlin {
              jvmToolchain(17)
          }
          """
          p.write_text(s)
          PY
          src = Path("palletmaster/app/src/main/java/com/example/palletfinder/MainActivity.kt")
          code = src.read_text()
          src.write_text(code.replace("singleLine", "isSingleLine"))
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p palletmaster assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PalletMaster-APK
          path: palletmaster/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
